[build-system]
requires = ["setuptools>=61", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "zomato-recommender"
version = "0.1.0"
description = "AI-powered restaurant recommendations (Zomato-inspired)"
readme = "README.md"
requires-python = ">=3.9"
dependencies = [
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.32.0",
    "pydantic-settings>=2.6.0",
    "httpx>=0.27.0",
    "datasets>=2.19.0",
    "pandas>=2.0.0",
    "pyarrow>=15.0.0",
]

[project.scripts]
zomato-serve = "recommender.api.main:run"

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
]

[tool.setuptools.packages.find]
where = ["src", "phase1/src", "phase2/src", "phase3/src", "phase4/src", "phase5/src", "phase6/src"]

[tool.pytest.ini_options]
testpaths = ["tests", "phase1/tests", "phase2/tests", "phase3/tests", "phase4/tests", "phase5/tests", "phase6/tests"]
pythonpath = ["src", "phase1/src", "phase2/src", "phase3/src", "phase4/src", "phase5/src", "phase6/src"]
